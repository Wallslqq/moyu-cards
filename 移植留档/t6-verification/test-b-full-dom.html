<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>测试B：完整版 Vue + DOM 模板（墨月骨架形态）</title>
  <style>[v-cloak]{display:none!important}.ok{color:#0a0}.fail{color:#c00}</style>
  <script src="./vue.global.js"></script>
</head>
<body>
  <div id="app" v-cloak>
    <p v-if="phase === 'ready'" class="ok" v-text="msg"></p>
    <p v-else v-text="'phase=' + phase"></p>
    <ul><li v-for="it in items" :key="it" v-text="it"></li></ul>
  </div>
  <p id="judge">待判定</p>
  <script>
    window.__errors = [];
    window.addEventListener('error', e => window.__errors.push(String(e.message)));
    window.addEventListener('load', () => setTimeout(() => {
      const el = document.querySelector('#app p');
      const judge = document.querySelector('#judge');
      if (el && el.textContent.includes('渲染成功')) {
        judge.textContent = '判定：渲染成功（完整版 Vue 编译 DOM 模板）';
        judge.className = 'ok';
      } else {
        judge.textContent = '判定：渲染失败 —— ' + (window.__errors.join(' | ') || 'v-cloak 未移除');
        judge.className = 'fail';
      }
    }, 300));
  </script>
  <script>
    const { createApp, ref } = Vue;
    try {
      const app = createApp({
        setup() {
          const phase = ref('ready');
          const msg = ref('渲染成功：DOM 模板被编译');
          const items = ref(['条目一', '条目二']);
          return { phase, msg, items };
        },
      });
      app.mount('#app');
    } catch (e) { window.__errors.push('mount 异常: ' + e.message); }
  </script>
</body>
</html>
